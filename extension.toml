id = "angular-plus"
name = "Angular Plus"
description = "Angular language support with HTML, Tailwind and fast template completions"
version = "0.1.0"
schema_version = 1
authors = ["nathansbradshaw", "Joyzyy"]
repository = "https://github.com/Joyzyy/zed-angular"

[language_servers.angular]
name = "Angular Language Server"
languages = ["TypeScript", "HTML", "Angular"]
language_ids = { "Angular" = "html", "HTML" = "html", "TypeScript" = "typescript" }
command = { extension = true }

[language_servers.angular-html]
name = "Angular HTML"
languages = ["Angular"]
language_ids = { "Angular" = "html" }

[grammars.angular]
repository = "https://github.com/dlvandenberg/tree-sitter-angular"
commit = "f0d0685701b70883fa2dfe94ee7dc27965cab841"
